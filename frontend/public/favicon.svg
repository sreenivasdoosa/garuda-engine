<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1a1e2e"/>
  <!-- Green candle (bullish) -->
  <rect x="6" y="8" width="4" height="12" rx="1" fill="#2dce89"/>
  <line x1="8" y1="5" x2="8" y2="8" stroke="#2dce89" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="20" x2="8" y2="24" stroke="#2dce89" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Red candle (bearish) -->
  <rect x="14" y="12" width="4" height="10" rx="1" fill="#f5365c"/>
  <line x1="16" y1="9" x2="16" y2="12" stroke="#f5365c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="16" y2="26" stroke="#f5365c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Green candle (bullish) -->
  <rect x="22" y="6" width="4" height="14" rx="1" fill="#2dce89"/>
  <line x1="24" y1="3" x2="24" y2="6" stroke="#2dce89" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="20" x2="24" y2="25" stroke="#2dce89" stroke-width="1.5" stroke-linecap="round"/>
</svg>
